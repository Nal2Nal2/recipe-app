<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>레시피 노트</title>
<meta name="theme-color" content="#2f6b3a">
<script src="jszip.min.js"></script>
<style>
/* Layout: kitchen notebook — search, category tabs, two-column photo cards, full-screen recipe page */
:root{
  --bg:#f5f5f0; --surface:#ffffff; --ink:#1d1f1a; --muted:#6b6f64; --line:#dfe0d8; --soft:#ecede6;
  --accent:#2f6b3a; --accent-ink:#ffffff; --accent-soft:#e2eee2; --saffron:#d99a12; --danger:#c0392b;
  --f-body:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121411; --surface:#1b1e19; --ink:#e7e9e2; --muted:#9ca196; --line:#2d312a; --soft:#242822;
  --accent:#7cc287; --accent-ink:#0f1a10; --accent-soft:#1f3322; --saffron:#f0b840; --danger:#ff8173; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 96px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
h1 small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:17px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0}
.search .x{border:0;background:transparent;color:var(--muted);font-size:16px;padding:4px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.cat b{font-weight:500;margin-left:4px;font-size:12px;opacity:.8}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rc{border:0;background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line);min-width:0}
.rc .ph{aspect-ratio:4/5;background:var(--soft) center top/cover no-repeat;position:relative}
.rc .fav{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.45);color:#ffd36b;border-radius:999px;font-size:12px;padding:1px 6px}
.rc .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rc .n{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--accent-soft);color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{margin:0;font-size:18px}
.empty p{margin:0;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn input{display:none}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.fab input{display:none}
.fine{font-size:12px;color:var(--muted);margin:0}

/* full pages */
.page{position:fixed;inset:0;background:var(--bg);z-index:8;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.page .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.page .bar h3{margin:0;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .body{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:12px}
.hero{border-radius:14px;overflow:hidden;background:var(--soft);border:0;padding:0;display:block;width:100%}
.hero img{display:block;width:100%;height:auto}
.dname{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.favbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.favbtn[aria-pressed="true"]{border-color:var(--saffron);color:var(--saffron)}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
details.ocr{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.ocr summary{padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
details.ocr pre{margin:0;padding:0 12px 12px;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;color:var(--ink)}
.zoom{position:fixed;inset:0;z-index:12;background:#000;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
.zoom img{display:block;width:100%;height:auto}
.zoom .close{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;width:40px;height:40px;font-size:18px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h4{margin:0;font-size:18px}
.sheet .sub{font-size:13px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.f textarea{min-height:80px;resize:vertical}
.foot{display:flex;gap:8px}
.foot .btn{flex:1}
.pend{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.pend:first-of-type{border-top:0}
.pend .th{width:64px;height:80px;border-radius:8px;background:var(--soft) center top/cover no-repeat;border:1px solid var(--line);padding:0;position:relative}
.pend .th::after{content:'⤢';position:absolute;right:3px;bottom:3px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:0 4px}
.pend .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.pend input,.pend select{font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface);width:100%}
.pend .rm{border:0;background:transparent;color:var(--muted);font-size:18px;padding:4px 6px}
.pend .st{font-size:12px;color:var(--muted)}
.cands{display:flex;flex-wrap:wrap;gap:4px}
.cands::before{content:"사진 속 글자:";font-size:11px;color:var(--muted);width:100%}
.cand{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink)}
.catlist{display:flex;flex-direction:column;gap:6px}
.catrow{display:flex;gap:6px;align-items:center}
.catrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface)}
.catrow button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;background:var(--soft);padding:10px 12px;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;padding:0;white-space:nowrap}
.busy{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:0;background:var(--surface);border-radius:16px;padding:0;overflow:hidden;text-align:left;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column}
.tile .covers{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:4/3;background:var(--soft)}
.tile .covers i{background:var(--soft) center top/cover no-repeat}
.tile .covers i:first-child{grid-row:1/3}
.tile .covers i:only-child{grid-column:1/3}
.tile .tl{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px}
.tile .tl b{font-size:16px}
.tile .tl span{font-size:13px;color:var(--muted)}
.tile.all .covers{display:none}
.tile.all{justify-content:center;border:1px dashed var(--line);box-shadow:none}
.crumb{display:flex;align-items:center;gap:10px}
.crumb b{font-size:18px}
.crumb span{color:var(--muted);font-size:13px}
.rc .cnt{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.5);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.rc .row2{display:flex;gap:6px;align-items:center}
.rc .mini{font-size:11px;color:var(--muted)}
.rc{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rc.on{outline:3px solid var(--accent);outline-offset:-3px}
.rc.on::after{content:'✓';position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
body.selecting .fab{display:none}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.selbar .sn{flex:1;font-size:14px}
.selbar .sb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px}
.selbar .sb.danger{color:var(--danger);border-color:var(--danger)}
.selbar .sx{border:0;background:transparent;font-size:18px;padding:4px 6px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pend{grid-template-columns:72px minmax(0,1fr)}
.pleft{display:flex;flex-direction:column;gap:6px;align-items:center}
.pend .th{width:72px;height:90px}
.rmtxt{border:0;background:transparent;color:var(--danger);font-size:11px;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.nwrap{position:relative}
.nwrap input{padding-right:34px}
.nwrap .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 6px}
.st.ok{color:var(--accent)}
.nimg{font-size:11px;font-weight:700;color:var(--accent)}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}
.mbtn.merge{border-color:var(--accent);color:var(--accent)}
.hero.cover img{max-height:60vh;object-fit:cover}
.car{position:relative;border-radius:14px;overflow:hidden;background:#111}
.car .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car .track::-webkit-scrollbar{display:none}
.car .slide{flex:0 0 100%;scroll-snap-align:center;border:0;padding:0;background:#111;display:grid;place-items:center}
.car.big .slide{height:min(68vh,560px)}
.car.pane .slide{height:100%;display:block;overflow-y:auto;-webkit-overflow-scrolling:touch}
.car.pane .slide img{width:100%;max-width:none;max-height:none;height:auto}
.car .slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.car .cbadge{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px}
.car .cnav{position:absolute;top:50%;transform:translateY(-50%);border:0;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:1}
.car .prev{left:8px}.car .next{right:8px}
.page.edit{display:flex;flex-direction:column;overflow:hidden}
.page.edit[hidden]{display:none!important}
.page.edit .bar{position:static;flex:none}
.epane{flex:none;height:38vh;background:#111}
.epane .car{height:100%;border-radius:0}
.epane .car .track{height:100%}
.efold{flex:none;border:0;border-bottom:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:12px;padding:5px}
.escroll{flex:1;overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto}
.cvrow{display:flex;gap:10px;align-items:flex-start}
.cvprev{width:96px;height:96px;flex:none;border-radius:10px;background:var(--soft) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:end center;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;padding-bottom:4px}
.cvbtns{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.btn.sm{padding:6px 10px;font-size:13px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.blk h5{margin:0 0 6px;font-size:14px;color:var(--accent)}
.ing{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li::marker{font-weight:700;color:var(--accent)}
.imgs{display:flex;flex-direction:column;gap:8px}
.eimgs{display:flex;gap:6px;flex-wrap:wrap}
.eimg{width:64px;height:80px;border-radius:8px;background:var(--soft) center top/cover no-repeat;position:relative;border:1px solid var(--line)}
.eimg button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:11px}
.otext{width:100%;min-height:120px;border:0;border-top:1px solid var(--line);padding:10px 12px;font-size:13px;background:transparent;color:var(--ink);resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>레시피 노트<small id="count"></small></h1>
    <button type="button" class="iconbtn" id="setBtn" aria-label="설정">⚙</button>
  </header>
  <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="메뉴명이나 재료로 찾기" autocomplete="off"><button type="button" class="x" id="qx" aria-label="검색어 지우기" hidden>✕</button></label>
  <div id="crumb"></div>
  <div id="list"></div>
</div>
<label class="fab" for="pick">+ 캡처 추가<input type="file" id="pick" accept="image/*" multiple></label>
<input type="file" id="pick2" accept="image/*" multiple hidden>
<div class="selbar" id="selBar" hidden></div>

<section class="page" id="detail" hidden></section>
<section class="page edit" id="editPage" hidden></section>
<div class="zoom" id="zoom" hidden><img id="zoomImg" alt=""><button type="button" class="close" id="zoomClose" aria-label="닫기">✕</button></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>되돌리기</button></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const Cap=window.Capacitor, NATIVE=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const collator=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});

const DEFAULT_CATS=['한식','양식','중식','일식','분식','디저트·베이킹','음료','기타'];
// 메뉴명/사진 속 글자에 이 단어가 있으면 그 카테고리로 먼저 골라둬요
const CAT_WORDS={
  '디저트·베이킹':['케이크','쿠키','브라우니','마들렌','스콘','타르트','머핀','푸딩','티라미수','빵','베이킹','휘낭시에','파운드','크림','마카롱','도넛','와플','팬케이크','젤리','아이스크림'],
  '음료':['라떼','에이드','스무디','주스','차 ','티 ','커피','하이볼','칵테일','밀크티','청 '],
  '분식':['떡볶이','김밥','라볶이','순대','어묵','튀김','쫄면','핫도그','토스트','유부초밥'],
  '중식':['짜장','짬뽕','탕수육','마라','마파','꿔바로우','깐풍','유린기','볶음밥','딤섬','양장피','고추잡채','멘보샤','훠궈'],

let dbp=null;
function db(){

    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('recipes',{keyPath:'id'});d.createObjectStore('images',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'})};

}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;Promise.resolve(fn(s)).then(v=>out=v);t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

// 사진 속 줄 중에서 메뉴명 후보를 골라 점수 순으로 돌려줘요
const UI_NOISE=['다시 보기','팔로우','팔로잉','댓글','좋아요','공유','더보기','번역 보기','답글','메시지','광고','스폰서','원본 오디오','오디오','구독','알림','저장됨','프로필','인기','추천'];
const FILLER=/(레시피|만드는\s*법|만들기|황금|초간단|간단|꿀팁|존맛|진짜|맛있는|최애|추천|저장\s*필수|필수)/g;
const QTY=/\d+(\.\d+)?\s*(컵|스푼|큰술|작은술|숟가락|티스푼|g|kg|ml|L|개|T|t|cc|장|알|쪽|줌|꼬집|분|인분)(?![가-힣])/;
function cleanTitle(t){
  return t.replace(/[^\p{Script=Hangul}A-Za-z0-9\s&()·.,\-~]/gu,' ').replace(/\d+\s*만\s*원(\s*주고\s*배운)?/g,' ').replace(FILLER,' ')
    .replace(/[()]/g,' ').replace(/\s+/g,' ').replace(/^[\s.,\-~·]+|[\s.,\-~·]+$/g,'').trim();
}
const DISH_WORDS=Object.values(CAT_WORDS).flat().map(w=>w.trim()).filter(w=>w.length>=2);
const DISH_SUFFIX=['찜','국','탕','전','죽','밥','면','볶음','구이','조림','무침','김치','샐러드','수프','라떼','청'];
function nameCandidates(res){
  if(!res||!res.lines||!res.lines.length)return [];
  const maxY=Math.max(...res.lines.map(l=>l.top+l.height),1), seen=new Set(), out=[];
  res.lines.forEach(l=>{
    const raw=(l.text||'').trim();
    if(!raw||/\d{1,2}:\d{2}/.test(raw)||/\d+\s*월\s*\d+\s*일/.test(raw))return;
    if(UI_NOISE.some(w=>raw.includes(w)))return;
    if(QTY.test(raw)||/재료|:/.test(raw))return;
    const t=cleanTitle(raw.replace(/^[A-Za-z0-9._]{3,}\s+/,''));
    if(t.length<2||t.length>22||!/[가-힣]/.test(t))return;
    if(/[!?]{2,}/.test(raw))return;
    // '소고기야채찜이예요' → '소고기야채찜'
    const t2=t.replace(/\s*(이에요|이예요|예요|에요|입니다|이랍니다|랍니다|이죠|이지요|이네요)[.!~^\s]*$/,'').trim();
    if(t2.length<2)return;
    if((t2.match(/\s/g)||[]).length>4)return;
    if(seen.has(t2))return; seen.add(t2);
    const pos=l.top/maxY;
    let sc=(l.height||1)*(1.5-pos);
    const dish=DISH_WORDS.some(w=>t2.includes(w))||DISH_SUFFIX.some(w=>t2.endsWith(w));
    if(dish)sc*=2.2;
    if(!/\s/.test(t2)&&t2.length>=3&&t2.length<=12)sc*=1.3;          // 띄어쓰기 없는 짧은 이름
    if(/(는데|더니|하고|나면|니다|어요|아요|해요|세요|었|았|겠|하는|되는|되고|좋아|같아|있는|없는|이거|그동안)/.test(t2))sc*=0.25; // 문장
    if(t2!==t)sc*=dish?1.1:0.7;                                       // '~이에요'로 끝나던 줄
    if(pos>0.8)sc*=0.6;
    out.push({text:t2,score:sc});
  });
  return out.sort((a,b)=>b.score-a.score);
}
const DISH_TAIL=['파스타','스파게티','리조또','샐러드','소스','드레싱','스튜','수프','카레','덮밥','볶음밥','비빔밥','김밥','국수','라면','우동','찌개','전골','볶음','조림','무침','구이','튀김','김치','장아찌','나물','수육','보쌈','찜','탕','국','전','죽','케이크','쿠키','빵','타르트','라떼','에이드','스무디','밀크티','청','잼','피클','샌드위치','토스트','버거','피자','그라탕','오믈렛','떡볶이','강정','냉면','칼국수','만두','전병','부침개'];
const TAIL_RE=new RegExp(`([가-힣A-Za-z]{1,10}(?:${DISH_TAIL.sort((a,b)=>b.length-a.length).join('|')}))(?=$|[^가-힣]|이에요|이예요|예요|에요|입니다|레시피|만들|는|은|을|를|이|가|도|로|으로|랑|와|과|에|의|니|인데)`,'g');
const TAIL_BAD=/^(이것|그것|저것|이거|그거|오늘|어제|내일|우리|제가|저는|진짜|완전|너무|정말|요즘|간단|초간단|맛있는|넣은|만든|먹는|하는|이번|다음|한국|집에서|엄마|아빠)/;
// 메뉴명: 확실할 때만 채우고, 아니면 비워 두고 후보만 보여줘요
function suggestName(res){
  const lines=nameCandidates(res);
  const text=res&&res.text||'', tok={};
  (text.match(TAIL_RE)||[]).forEach(w=>{w=w.trim();if(w.length<3||w.length>12||TAIL_BAD.test(w))return;tok[w]=(tok[w]||0)+1});
  const toks=Object.entries(tok).map(([w,n])=>{
    const inTitle=lines.slice(0,3).some(l=>l.text===w||l.text.replace(/\s/g,'')===w);
    return {text:w,score:10+n*3+(inTitle?8:0)};
  }).sort((a,b)=>b.score-a.score);
  const seen=new Set(), cands=[];
  [...toks,...lines].forEach(c=>{const k=c.text.replace(/\s/g,'');if(seen.has(k))return;seen.add(k);cands.push(c.text)});
  let name='';
  if(toks.length&&(toks.length===1||toks[0].score>toks[1].score))name=toks[0].text;   // 음식 이름이 하나로 분명할 때
  else if(lines.length){const t=lines[0].text;if(!/\s/.test(t)&&t.length>=2&&t.length<=12&&(DISH_WORDS.some(w=>t.includes(w))||DISH_TAIL.some(w=>t.endsWith(w))))name=t}
  return {name,cands:cands.slice(0,8)};
}
function guessName(res,fallback){return suggestName(res).name||fallback}
function guessCat(name,text){
  const hay=(name+' ').repeat(3)+' '+(text||'');
  let best='', score=0;
  Object.entries(CAT_WORDS).forEach(([c,ws])=>{if(!cats.includes(c))return;let s=0;ws.forEach(w=>{
    if(w.trim().length<2){if(name.trim().endsWith(w.trim()))s+=3;return}   // '국','전' 같은 한 글자는 메뉴명 끝에 붙을 때만
    const n=hay.split(w).length-1;s+=n*(name.includes(w.trim())?3:1)});if(s>score){score=s;best=c}});
  return best||(cats.includes('기타')?'기타':cats[cats.length-1]);
}

/* ---------- 레시피 내용 정리: 재료 / 만드는 법 ---------- */
const UNIT='(?:컵|스푼|큰술|작은술|숟가락|숟갈|티스푼|밥숟가락|g|kg|mg|ml|mL|L|l|cc|개|알|장|쪽|줌|꼬집|마리|모|대|뿌리|봉지|봉|팩|캔|T|t|Ts|ts|tbsp|tsp|인치|cm)';
const ING_RE=new RegExp(`(\\d+(?:[.,]\\d+)?(?:\\s*\\/\\s*\\d+)?|반|한|두|세|약간|적당량|조금|한줌|한꼬집)\\s*${UNIT}(?![가-힣])|약간|적당량|한꼬집|한줌`);
const ING_SPLIT=new RegExp(`([^,·/\\d]{1,15}?\\s*(?:\\d+(?:[.,]\\d+)?(?:\\s*\\/\\s*\\d+)?|반|약간|적당량)\\s*${UNIT}?(?:\\([^)]*\\))?)`,'g');
const STEP_RE=/^\s*(?:(\d{1,2})\s*[.)\]]|[①-⑳❶-❿➀-➉]|step\s*\d+|STEP\s*\d+|\d{1,2}\s+(?=[가-힣]))/;
function isNoise(t){return /\d{1,2}:\d{2}/.test(t)||/^\s*[\d,.\s]+$/.test(t)||UI_NOISE.some(w=>t.includes(w))||/^[A-Za-z0-9._]+$/.test(t.trim())}
function parseRecipe(text){
  const lines=String(text||'').split(/\n+/).map(l=>l.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{2775}\u{278A}-\u{27BF}\u{FE0F}]/gu,'').trim()).filter(Boolean);
  const ing=[], steps=[]; let mode='', lastStepOpen=false;
  const addIng=s=>{s=s.replace(/^[-•·*▪︎\s]+/,'').replace(/^재료\s*[:：]?\s*/,'').trim();if(s.length>=2&&s.length<=40&&!ing.includes(s))ing.push(s)};
  for(const raw of lines){
    if(isNoise(raw))continue;
    const t=raw;
    if(t==='---'){mode='';lastStepOpen=false;continue}   // 합친 캡처 사이 경계
    if(/^(재료|준비물|필요한\s*재료|양념|소스|드레싱)\s*[:：]?\s*$/.test(t)||/재료\s*\(/.test(t)&&t.length<16){mode='ingHdr';lastStepOpen=false;continue}
    if(/^(만드는\s*(법|방법)|조리\s*(법|방법|순서)|레시피\s*순서|방법)\s*[:：]?\s*$/.test(t)){mode='step';lastStepOpen=false;continue}
    if(STEP_RE.test(t)){
      const s=t.replace(STEP_RE,'').trim(); if(s){steps.push(s);lastStepOpen=!/(다|요|음|함|기)[.!~\s]*$/.test(s)}
      mode='step'; continue;
    }
    if(lastStepOpen&&!ING_RE.test(t)&&t.length<60){steps[steps.length-1]+=' '+t;lastStepOpen=!/(다|요|음|함|기)[.!~\s]*$/.test(t);continue}
    lastStepOpen=false;
    if(/^재료\s*[:：]/.test(t)||(ING_RE.test(t)&&(t.match(new RegExp(UNIT,'g'))||[]).length>=2&&t.length>18)){
      const body=t.replace(/^.*?재료\s*[:：]\s*/,''); const parts=body.match(ING_SPLIT);
      (parts&&parts.length>1?parts:[body]).forEach(p=>addIng(p.trim())); mode='ing'; continue;
    }
    if(ING_RE.test(t)&&t.length<=40&&!/(는데|더니|어요|해요|했어요|세요|니다)[.!~\s]*$/.test(t)){addIng(t);mode='ing';continue}
    if(mode==='ingHdr'&&/,/.test(t)&&t.length<=40&&!/(요|다)[.!~\s]*$/.test(t)){t.split(/[,，]/).forEach(x=>addIng(x));continue}
    if(mode==='step'&&t.length>=6&&t.length<80&&/(다|요|기|음)[.!~\s]*$/.test(t)&&steps.length){steps.push(t);continue}
  }
  return {ingredients:ing,steps};
}

function pickImages(){
  const G=NATIVE&&Cap.Plugins&&Cap.Plugins.GalleryPicker;
  const viaInput=()=>new Promise(res=>{const inp=$('pick2');inp.value='';inp.onchange=()=>res([...inp.files]);inp.click()});
  if(!G)return viaInput();
  return G.pick().then(async({files})=>Promise.all((files||[]).map(async(f,i)=>{const b=await (await fetch(Cap.convertFileSrc('file://'+f.path))).blob();return new File([b],`gallery_${i}.jpg`,{type:b.type||'image/jpeg'})}))).catch(()=>viaInput());
}
async function prepImage(file){
  const {i,u}=await loadImg(file);
  const full=await shrink(i,1280,0.86), thumb=await shrink(i,360,0.8);
  const res=await readText(file);
  let cover=null; try{cover=await findFoodPhoto(i,res&&res.lines)}catch(e){}
  URL.revokeObjectURL(u);
  return {full,thumb,res,text:res&&res.text||'',cover};
}
/* 캡처 속 음식 사진 찾기: 글자가 아니고 색이 다양한 가장 큰 가로 띠를 잘라내요 */
async function findFoodPhoto(img,lines){
  const NW=img.naturalWidth, NH=img.naturalHeight; if(!NW||!NH)return null;
  const W=90, H=Math.max(1,Math.round(NH*W/NW)), sc=H/NH;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(img,0,0,W,H); const d=g.getImageData(0,0,W,H).data;
  const textRow=new Uint8Array(H);
  (lines||[]).forEach(l=>{const a=Math.max(0,Math.floor(l.top*sc)),b=Math.min(H-1,Math.ceil((l.top+l.height)*sc));for(let y=a;y<=b;y++)textRow[y]=1});
  const photo=new Uint8Array(H);
  for(let y=0;y<H;y++){
    let sum=0,sum2=0,sat=0; const cols=new Set();
    for(let x=0;x<W;x++){
      const k=(y*W+x)*4, r=d[k],gg=d[k+1],b=d[k+2], mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), l=(r+gg+b)/3;
      sum+=l; sum2+=l*l; sat+=mx?(mx-mn)/mx:0; cols.add((r>>5)<<6|(gg>>5)<<3|(b>>5));
    }
    const m=sum/W, sd=Math.sqrt(Math.max(0,sum2/W-m*m)), st=sat/W, nc=cols.size;
    const like=(st>0.08&&nc>=4)||(nc>=12&&sd>20);   // 글자 줄은 흰 바탕에 회색 몇 가지뿐이라 색이 거의 없어요
    photo[y]=like&&!(textRow[y]&&nc<16)?1:0;
  }
  const top=Math.floor(H*0.04), bot=Math.ceil(H*0.94), gap=Math.max(2,Math.round(H*0.015));
  let best=[0,0], s0=-1, miss=0;
  for(let y=top;y<=bot;y++){
    if(y<bot&&photo[y]){if(s0<0)s0=y;miss=0}
    else if(s0>=0){miss++;if(miss>gap||y===bot){const e=y-miss;if(e-s0>best[1]-best[0])best=[s0,e];s0=-1;miss=0}}
  }
  if(best[1]-best[0]<W*0.45)return null;
  let y0=best[0]/sc, y1=best[1]/sc;
  if(y1-y0>NW*1.4){const mid=(y0+y1)/2;y0=mid-NW*0.65;y1=mid+NW*0.65}
  const ow=Math.min(900,NW), oh=Math.round((y1-y0)*ow/NW);
  const o=document.createElement('canvas'); o.width=ow; o.height=oh;
  o.getContext('2d').drawImage(img,0,y0,NW,y1-y0,0,0,ow,oh);
  return await toBlob(o,0.85);
}

// 두 장 이상이 레시피 하나일 때: 아래 캡처를 위 레시피에 붙여요
function recompute(t){
  const all=[t,...t.extra];
  t.text=all.map(x=>x.text).filter(Boolean).join('\n');
  const pr=parseRecipe(all.map(x=>x.text).filter(Boolean).join('\n---\n')); t.ingredients=pr.ingredients; t.steps=pr.steps;
  const lines=[]; let off=0; all.forEach(x=>{(x.res&&x.res.lines||[]).forEach(l=>lines.push(Object.assign({},l,{top:l.top+off})));off+=10000});
  const g=suggestName({text:t.text,lines}); t.cands=g.cands;
  if(!t.edited&&!t.name)t.name=g.name;
  if(!t.catEdited)t.cat=guessCat(t.name||g.cands[0]||'',t.text);
}
function mergeUp(p){
  const i=pending.indexOf(p); if(i<1)return; const t=pending[i-1];
  t.extra.push({id:p.id,file:p.file,full:p.full,thumb:p.thumb,text:p.text,res:p.res,cover:p.cover},...p.extra);
  pending.splice(i,1); recompute(t); drawPending(); toast(`'${t.name||'위 레시피'}'에 캡처를 합쳤어요`);
}
function splitOut(p){
  const i=pending.indexOf(p), ex=p.extra; p.extra=[];
  const items=ex.map(x=>{const n={id:x.id,file:x.file,full:x.full,thumb:x.thumb,text:x.text,res:x.res,cover:x.cover,extra:[],status:'',thumbU:URL.createObjectURL(x.thumb)};recompute(n);return n});
  recompute(p); pending.splice(i+1,0,...items); drawPending();
}
async function savePending(){
  const ok=pending.filter(p=>!p.bad&&p.full);
  const now=Date.now(); let i=0;
  for(const p of ok){
    const ex=p.extra||[], cover=p.cover||(ex.find(x=>x.cover)||{}).cover||null;
    const r={id:p.id,name:(p.name||'').trim()||'이름 없는 레시피',cat:p.cat||'기타',fav:false,memo:'',text:p.text||'',ingredients:p.ingredients||[],steps:p.steps||[],imgs:[p.id,...ex.map(x=>x.id)],cover:!!cover,created:now+(i++)};
    await putImage({id:p.id,rid:p.id,full:p.full,thumb:p.thumb});
    for(const x of ex)await putImage({id:x.id,rid:p.id,full:x.full,thumb:x.thumb});
    if(cover){await putImage({id:'cover_'+p.id,rid:p.id,full:cover,thumb:await coverThumb(cover)});if(p.thumbU){URL.revokeObjectURL(p.thumbU);p.thumbU=''}}
    await saveRecipe(r); recipes.push(r);
    if(p.thumbU)thumbs[p.id]=p.thumbU;
  }
  pending=[]; closeSheet(); render(); toast(`레시피 ${ok.length}개를 저장했어요`);
}

/* 사진 넘겨보기: 옆으로 밀거나 화살표, 누르면 크게 보기 */
function carousel(slides,urlBag,size){
  const wrap=document.createElement('div'); wrap.className='car '+(size||'');
  if(!slides.length){wrap.innerHTML='<p class="fine">사진이 없어요</p>';return wrap}
  wrap.innerHTML=`<div class="track"></div>${slides.length>1?'<button type="button" class="cnav prev" aria-label="이전 사진">‹</button><button type="button" class="cnav next" aria-label="다음 사진">›</button>':''}<div class="cbadge"><span class="ci">1</span>/${slides.length} · <span class="cl">${esc(slides[0].label)}</span>${size==='pane'?' · 위아래로 밀어 보기':''}</div>`;
  const tr=wrap.querySelector('.track');
  slides.forEach(sl=>{
    const u=sl.url||URL.createObjectURL(sl.blob); if(!sl.url&&urlBag)urlBag.push(u);
    const b=document.createElement('button'); b.type='button'; b.className='slide'; b.setAttribute('aria-label',sl.label+' 크게 보기');
    b.innerHTML='<img alt="">'; b.querySelector('img').src=u; b.querySelector('img').alt=sl.label;
    b.onclick=()=>{$('zoomImg').src=u;$('zoom').hidden=false;$('zoom').scrollTop=0};
    tr.appendChild(b);
  });
  const cur=()=>Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));
  tr.addEventListener('scroll',()=>{const i=Math.min(slides.length-1,cur());wrap.querySelector('.ci').textContent=i+1;wrap.querySelector('.cl').textContent=slides[i].label},{passive:true});
  const go=d=>tr.scrollTo({left:(cur()+d)*tr.clientWidth,behavior:'smooth'});
  const pv=wrap.querySelector('.prev'), nx=wrap.querySelector('.next'); if(pv)pv.onclick=()=>go(-1); if(nx)nx.onclick=()=>go(1);
  return wrap;
}

  const pg=$('editPage'); pg.hidden=false;
  pg.innerHTML=`<div class="bar"><button type="button" class="iconbtn" id="eClose" aria-label="편집 닫기">✕</button><h3>레시피 편집</h3><button type="button" class="btn primary sm" id="eSaveTop">저장</button></div>
    <div class="epane" id="ePane"></div><button type="button" class="efold" id="eFold" aria-expanded="true">사진 접기 ▴</button><div class="escroll" id="eForm"></div>`;
  $('eFold').onclick=()=>{const p=$('ePane'),o=$('eFold').getAttribute('aria-expanded')==='true';p.hidden=o;$('eFold').setAttribute('aria-expanded',!o);$('eFold').textContent=o?'사진 펼치기 ▾':'사진 접기 ▴'};
  build($('eForm'));
}
function openEdit(r){
  const imgs=imgIds(r).slice();
  openEditPage(sh=>{
    sh.innerHTML=`
      <label class="f">메뉴명<input id="eName" value="${esc(r.name)}"></label>
      <label class="f">카테고리<select id="eCat">${cats.map(c=>`<option ${c===r.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="f">재료 (한 줄에 하나씩)<textarea id="eIng" rows="5">${esc((r.ingredients||[]).join('\n'))}</textarea></label>
      <label class="f">만드는 법 (한 줄에 한 단계씩)<textarea id="eSteps" rows="5">${esc((r.steps||[]).join('\n'))}</textarea></label>
      <button type="button" class="btn" id="eReparse">사진 속 글자로 재료·순서 다시 정리</button>
      <label class="f">메모<textarea id="eMemo" placeholder="간을 조금 줄였더니 좋았음 등">${esc(r.memo||'')}</textarea></label>
      <div class="f">대표 사진<div class="cvrow"><div class="cvprev" id="eCv"></div><div class="cvbtns"><button type="button" class="btn sm" id="cvAuto">캡처에서 음식 사진 찾기</button><button type="button" class="btn sm" id="cvNone">캡처 그대로 쓰기</button><button type="button" class="btn sm" id="cvPick">갤러리에서 고르기</button></div></div><span class="st" id="cvSt"></span></div>
      <div class="f">캡처<div class="eimgs" id="eImgs"></div><button type="button" class="btn" id="eAddImg">+ 캡처 더 붙이기</button><span class="st" id="eImgSt"></span></div>
      <details class="ocr"><summary>사진 속 글자 (검색에 쓰여요)</summary><textarea id="eText" class="otext">${esc(r.text||'')}</textarea></details>
      <div class="foot"><button type="button" class="btn primary" id="eSave">저장</button></div>
      <button type="button" class="btn danger" id="eDel">레시피 삭제</button>`;
    const added=[], removed=[];
    const drawImgs=async()=>{
      const box=sh.querySelector('#eImgs'); box.innerHTML='';
      const slides=[]; for(let k=0;k<imgs.length;k++){const iid=imgs[k];const o=added.find(x=>x.id===iid)||await getImage(iid);if(o)slides.push({blob:o.full,label:imgs.length>1?`캡처 ${k+1}`:'캡처'})}
      const pane=$('ePane'); if(pane){pane.innerHTML='';pane.appendChild(carousel(slides,editURLs,'pane'))}
      for(const iid of imgs){
        const it=document.createElement('div'); it.className='eimg';
        const a=added.find(x=>x.id===iid), o=a||await getImage(iid);
        if(o){const u=URL.createObjectURL(o.thumb||o.full);it.style.backgroundImage=`url("${u}")`}
        if(imgs.length>1){const x=document.createElement('button');x.type='button';x.textContent='✕';x.setAttribute('aria-label','이 캡처 빼기');x.onclick=()=>{imgs.splice(imgs.indexOf(iid),1);removed.push(iid);drawImgs()};it.appendChild(x)}
        box.appendChild(it);
      }
    };
    drawImgs();
    let cvOp=null; // null=그대로, 'none'=없앰, Blob=새 사진
    const drawCv=async()=>{
      const el=sh.querySelector('#eCv'); el.style.backgroundImage='';
      let o=null;
      if(cvOp instanceof Blob)o={full:cvOp}; else if(cvOp!=='none'&&r.cover)o=await getImage('cover_'+r.id);
      if(o){el.style.backgroundImage=`url("${URL.createObjectURL(o.full)}")`;el.textContent=''}
      else{const first=added.find(x=>x.id===imgs[0])||await getImage(imgs[0]);if(first)el.style.backgroundImage=`url("${URL.createObjectURL(first.thumb||first.full)}")`;el.textContent='캡처'}
    };
    drawCv();
    sh.querySelector('#cvAuto').onclick=async()=>{
      const st=sh.querySelector('#cvSt'); st.textContent='찾는 중…';
      for(const iid of imgs){const o=added.find(x=>x.id===iid)||await getImage(iid);if(!o)continue;const {i,u}=await loadImg(o.full);const res=await readText(o.full);const c=await findFoodPhoto(i,res&&res.lines);URL.revokeObjectURL(u);if(c){cvOp=c;st.textContent='음식 사진을 찾았어요 · 저장을 눌러야 반영돼요';drawCv();return}}
      st.textContent='캡처에서 음식 사진을 못 찾았어요. 갤러리에서 골라 주세요.';
    };
    sh.querySelector('#cvNone').onclick=()=>{cvOp='none';sh.querySelector('#cvSt').textContent='캡처를 그대로 대표 사진으로 써요';drawCv()};
    sh.querySelector('#cvPick').onclick=async()=>{const f=(await pickImages())[0];if(!f)return;const {i,u}=await loadImg(f);cvOp=await shrink(i,900,0.86);URL.revokeObjectURL(u);sh.querySelector('#cvSt').textContent='고른 사진을 대표 사진으로 써요 · 저장을 눌러야 반영돼요';drawCv()};
    $('eClose').onclick=closeEdit; $('eSaveTop').onclick=()=>sh.querySelector('#eSave').click();
    sh.querySelector('#eReparse').onclick=()=>{const pr=parseRecipe(sh.querySelector('#eText').value);sh.querySelector('#eIng').value=pr.ingredients.join('\n');sh.querySelector('#eSteps').value=pr.steps.join('\n');toast(`재료 ${pr.ingredients.length}개 · 순서 ${pr.steps.length}단계로 다시 정리했어요`)};
    sh.querySelector('#eAddImg').onclick=async()=>{
      const files=await pickImages(); if(!files||!files.length)return;
      const stl=sh.querySelector('#eImgSt'); stl.innerHTML='<span class="busy"><i class="spin"></i>사진 속 글자 읽는 중…</span>';
      for(const f of files){
        try{
          const o=await prepImage(f), id=uid();
          added.push({id,full:o.full,thumb:o.thumb}); imgs.push(id);
          if(o.text){
            const ta=sh.querySelector('#eText'); ta.value=(ta.value?ta.value+'\n':'')+o.text;
            const pr=parseRecipe(o.text), ei=sh.querySelector('#eIng'), es=sh.querySelector('#eSteps');
            const cur=ei.value.split('\n').filter(Boolean); pr.ingredients.forEach(x=>{if(!cur.includes(x))cur.push(x)}); ei.value=cur.join('\n');
            if(pr.steps.length)es.value=(es.value.trim()?es.value.trim()+'\n':'')+pr.steps.join('\n');
          }
        }catch(e){}
      }
      stl.textContent=`캡처 ${files.length}장을 붙였어요 · 저장을 눌러야 반영돼요`; drawImgs();
    };
    sh.querySelector('#eSave').onclick=async()=>{
      r.name=sh.querySelector('#eName').value.trim()||r.name; r.cat=sh.querySelector('#eCat').value;
      r.ingredients=sh.querySelector('#eIng').value.split('\n').map(s=>s.trim()).filter(Boolean);
      r.steps=sh.querySelector('#eSteps').value.split('\n').map(s=>s.trim()).filter(Boolean);
      r.memo=sh.querySelector('#eMemo').value.trim(); r.text=sh.querySelector('#eText').value;
      for(const a of added)if(imgs.includes(a.id))await putImage({id:a.id,rid:r.id,full:a.full,thumb:a.thumb});
      for(const iid of removed)if(!imgs.includes(iid))await tx('images','readwrite',s=>s.delete(iid));
      r.imgs=imgs.slice();
      if(cvOp==='none'){await tx('images','readwrite',s=>s.delete('cover_'+r.id));r.cover=false}
      else if(cvOp instanceof Blob){await putImage({id:'cover_'+r.id,rid:r.id,full:cvOp,thumb:await coverThumb(cvOp)});r.cover=true}
      if(thumbs[r.id]){URL.revokeObjectURL(thumbs[r.id]);delete thumbs[r.id]}
      await saveRecipe(r); closeEdit(); await openDetail(r.id); render(); toast('저장했어요');
    };
    sh.querySelector('#eDel').onclick=async()=>{
      const imgsData=[]; for(const iid of [...imgIds(r),'cover_'+r.id]){const o=await getImage(iid);if(o)imgsData.push(o)}
      lastDeleted=[{r:Object.assign({},r),imgs:imgsData}];
      await delRecipe(r); recipes=recipes.filter(x=>x.id!==r.id);
      if(thumbs[r.id]){URL.revokeObjectURL(thumbs[r.id]);delete thumbs[r.id]}
      closeEdit(); closeDetail(); render(); toast(`'${r.name}' 삭제했어요`,true);
    };
  });
}

/* ---------- settings ---------- */
$('setBtn').onclick=()=>openSettings();
function openSettings(){
  openSheet(sh=>{
    sh.innerHTML=`<div><h4>설정</h4></div>
      <div class="f">카테고리<div class="catlist" id="catList"></div><div class="catrow"><input id="newCat" placeholder="새 카테고리 이름"><button type="button" id="addCat">추가</button></div></div>
      <div class="f">백업<span class="fine">레시피와 사진은 이 폰 안에만 저장돼요. 폰을 바꾸거나 앱을 지우기 전에 백업 파일을 만들어 두세요.</span>
        <div class="row"><button type="button" class="btn" id="bExport">백업 파일 만들기</button><label class="btn" for="bImport">백업 불러오기<input type="file" id="bImport" accept=".zip,application/zip"></label></div></div>
      <div class="foot"><button type="button" class="btn" id="sClose">닫기</button></div>`;
    const draw=()=>{
      const cl=sh.querySelector('#catList'); cl.innerHTML='';
      cats.forEach((c,i)=>{
        const n=recipes.filter(r=>r.cat===c).length;
        const row=document.createElement('div'); row.className='catrow';
        row.innerHTML=`<input value="${esc(c)}" aria-label="카테고리 이름"><button type="button" class="up" aria-label="위로">↑</button><button type="button" class="del">${n?`삭제(${n})`:'삭제'}</button>`;
        const inp=row.querySelector('input');
        inp.onchange=async()=>{const v=inp.value.trim();if(!v||cats.includes(v)){inp.value=c;return}cats[i]=v;for(const r of recipes)if(r.cat===c){r.cat=v;await saveRecipe(r)}await saveCats();if(curCat===c)curCat=v;draw();render()};
        row.querySelector('.up').onclick=async()=>{if(!i)return;[cats[i-1],cats[i]]=[cats[i],cats[i-1]];await saveCats();draw();render()};
        row.querySelector('.del').onclick=async()=>{
          if(cats.length<=1)return;
          const to=cats.includes('기타')&&c!=='기타'?'기타':cats.find(x=>x!==c);
          cats.splice(i,1); for(const r of recipes)if(r.cat===c){r.cat=to;await saveRecipe(r)}
          await saveCats(); draw(); render(); if(n)toast(`${c}의 레시피 ${n}개는 '${to}'로 옮겼어요`);
        };
        cl.appendChild(row);
      });
    };
    draw();
    sh.querySelector('#addCat').onclick=async()=>{const v=sh.querySelector('#newCat').value.trim();if(!v||cats.includes(v))return;cats.push(v);await saveCats();sh.querySelector('#newCat').value='';draw();render()};
    sh.querySelector('#sClose').onclick=closeSheet;
    sh.querySelector('#bExport').onclick=exportBackup;
    sh.querySelector('#bImport').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importBackup(f)};
  });
}
async function exportBackup(){
  if(!window.JSZip){toast('백업 도구를 못 불러왔어요');return}
  if(!recipes.length){toast('백업할 레시피가 없어요');return}
  toast('백업 파일 만드는 중…');
  const z=new JSZip();
  z.file('recipes.json',JSON.stringify({v:2,cats,recipes},null,1));
  for(const r of recipes)for(const iid of [...imgIds(r),...(r.cover?['cover_'+r.id]:[])]){const o=await getImage(iid);if(o){z.file(`images/${iid}.jpg`,o.full);if(o.thumb)z.file(`thumbs/${iid}.jpg`,o.thumb)}}
  const d=new Date(), name=`레시피노트_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.zip`;
  try{
    if(NATIVE){
      const b64=await z.generateAsync({type:'base64'});
      const w=await Cap.Plugins.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
      try{await Cap.Plugins.Share.share({title:name,files:[w.uri]})}catch(err){if(!/cancel/i.test(String(err&&err.message||err)))throw err}
    }else{
      const blob=await z.generateAsync({type:'blob'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    }
    toast('백업 파일을 만들었어요');
  }catch(e){toast('백업 파일을 만들지 못했어요')}
}
async function importBackup(file){
  try{
    const z=await JSZip.loadAsync(file); const j=JSON.parse(await z.file('recipes.json').async('string'));
    let added=0;
    for(const r of j.recipes||[]){
      if(recipes.some(x=>x.id===r.id))continue;
      let got=0;
      for(const iid of [...imgIds(r),...(r.cover?['cover_'+r.id]:[])]){
        const full=z.file(`images/${iid}.jpg`), th=z.file(`thumbs/${iid}.jpg`); if(!full)continue;
        const fb=new Blob([await full.async('arraybuffer')],{type:'image/jpeg'}), tb=th?new Blob([await th.async('arraybuffer')],{type:'image/jpeg'}):fb;
        await putImage({id:iid,rid:r.id,full:fb,thumb:tb}); got++;
      }
      if(!got)continue;
      await saveRecipe(r); recipes.push(r); added++;
    }
    (j.cats||[]).forEach(c=>{if(!cats.includes(c))cats.push(c)}); await saveCats();
    closeSheet(); render(); toast(`레시피 ${added}개를 불러왔어요${(j.recipes||[]).length>added?' · 이미 있는 건 건너뛰었어요':''}`);
  }catch(e){toast('백업 파일을 읽지 못했어요. 이 앱에서 만든 .zip 파일인지 확인해 주세요')}
}

/* ---------- sheet / toast / search ---------- */
function openSheet(build){const sh=$('sheet');sh.innerHTML='';build(sh);$('scrim').hidden=false}
function closeSheet(){$('scrim').hidden=true;$('sheet').innerHTML=''}
$('scrim').addEventListener('click',e=>{if(e.target.id==='scrim'&&!pending.length)closeSheet()});
function toast(msg,undo){
  $('toastMsg').textContent=msg; $('toastUndo').hidden=!undo; $('toast').hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{$('toast').hidden=true},4000);
}
$('toastUndo').onclick=async()=>{
  if(!lastDeleted)return; const list=lastDeleted; lastDeleted=null;
  for(const {r,imgs} of list){for(const o of imgs||[])await putImage(o); await saveRecipe(r); recipes.push(r)}
  $('toast').hidden=true; render(); toast(`레시피 ${list.length}개를 되살렸어요`);
};
let qt=null;
$('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value;$('qx').hidden=!query;render()},150)});
$('qx').onclick=()=>{$('q').value='';query='';$('qx').hidden=true;render()};

/* 안드로이드 뒤로가기: 확대 → 창 → 상세 → 검색/카테고리 → 앱 닫기 */
if(NATIVE&&Cap.Plugins&&Cap.Plugins.App){
  Cap.Plugins.App.addListener('backButton',()=>{
    if(!$('zoom').hidden){$('zoom').hidden=true;return}
    if(!$('scrim').hidden){if(pending.length)pending=[];closeSheet();return}
    if(!$('editPage').hidden){closeEdit();return}
    if(!$('detail').hidden){closeDetail();return}
    if(selMode){exitSel();return}
    if(query){$('q').value='';query='';$('qx').hidden=true;render();return}
    if(curCat){curCat=null;render();return}
    Cap.Plugins.App.exitApp();
  });
}

loadAll().then(render).catch(()=>{render();toast('저장 공간을 열지 못했어요')});
})();
</script>
